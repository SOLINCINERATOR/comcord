<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comcord</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="auth" class="screen">
    <div class="auth-card">
      <div class="brand">COMCORD</div>
      <div class="muted">Your groups. Your people. Your way.</div>

      <div id="loginBox">
        <h1>Welcome back</h1>
        <input id="loginUser" placeholder="Username" autocomplete="username">
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn">Log in</button>
        <button class="ghost" id="showRegister">Create account</button>
      </div>

      <div id="registerBox" hidden>
        <h1>Create account</h1>
        <input id="regUser" placeholder="Username">
        <input id="regDisplay" placeholder="Display name (optional)">
        <input id="regEmail" type="email" placeholder="Email (optional)">
        <input id="regPassword" type="password" placeholder="Password">
        <button id="registerBtn">Create account</button>
        <button class="ghost" id="showLogin">Back to login</button>
      </div>
      <div id="authStatus" class="status"></div>
    </div>
  </div>

  <div id="app" hidden>
    <aside class="left">
      <div class="logo">C</div>
      <div id="serverList" class="server-list"></div>
      <button id="createServer" class="round">+</button>
    </aside>

    <aside class="middle">
      <div class="topbar">
        <strong>Comcord</strong>
        <button id="logout" class="ghost small">Log out</button>
      </div>
      <div class="section-title">DIRECT MESSAGES</div>
      <div id="friendList"></div>
      <button id="addFriend" class="wide">＋ Add friend</button>
      <div class="section-title">CURRENT GROUP</div>
      <div id="channelList"></div>
    </aside>

    <main class="main">
      <header id="chatHeader"><strong>Select a chat</strong></header>
      <section id="messages"></section>
      <form id="messageForm" class="composer">
        <input id="messageInput" placeholder="Message..." autocomplete="off">
        <button>Send</button>
      </form>
    </main>

    <aside class="right">
      <div class="profile-preview">
        <div id="myAvatar" class="avatar big">C</div>
        <h3 id="myName">User</h3>
        <div id="myStatus" class="muted">online</div>
      </div>
      <div class="settings">
        <h3>Profile</h3>
        <input id="profileDisplay" placeholder="Display name">
        <input id="profileAvatar" placeholder="Avatar URL">
        <input id="profileBanner" placeholder="Banner URL">
        <select id="profileStatus">
          <option value="online">Online</option>
          <option value="idle">Idle</option>
          <option value="dnd">Do not disturb</option>
          <option value="invisible">Invisible</option>
        </select>
        <button id="saveProfile">Save profile</button>
        <button id="changePassword" class="ghost">Change password</button>
      </div>
    </aside>
  </div>

  <dialog id="serverDialog">
    <form method="dialog" class="dialog-card" id="serverForm">
      <h2>Create group</h2>
      <input id="serverName" required placeholder="Group name">
      <input id="serverMax" type="number" min="1" max="10000" value="100" required>
      <input id="serverDesc" placeholder="Description (optional)">
      <div class="dialog-actions">
        <button value="cancel" class="ghost">Cancel</button>
        <button id="createServerSubmit" value="default">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="friendDialog">
    <form method="dialog" class="dialog-card" id="friendForm">
      <h2>Add friend</h2>
      <input id="friendUsername" placeholder="Username" required>
      <div class="dialog-actions">
        <button value="cancel" class="ghost">Cancel</button>
        <button id="sendFriendRequest">Send request</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
